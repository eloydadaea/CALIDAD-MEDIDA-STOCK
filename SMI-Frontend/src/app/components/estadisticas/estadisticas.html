<div class="view-section vista-activa">
    <h3 class="section-title" style="text-transform: uppercase; margin-bottom: 25px; font-size: 15px; font-weight: 700;">Dashboard y Estadísticas</h3>

    <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 40px;">
        
        <div style="background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); border-left: 5px solid #2e7d32; display: flex; align-items: center; gap: 20px;">
            <div style="background: #e8f5e9; padding: 15px; border-radius: 50%; color: #2e7d32; font-size: 24px;">
                <i class="fa-solid fa-arrow-down-short-wide"></i>
            </div>
            <div>
                <p style="margin: 0; color: #666; font-size: 14px; font-weight: 600;">Total Ingresos (Unidades)</p>
                <h2 style="margin: 5px 0 0 0; color: #1a1a1a; font-size: 28px;">{{ totalIngresos }}</h2>
            </div>
        </div>

        <div style="background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); border-left: 5px solid #c62828; display: flex; align-items: center; gap: 20px;">
            <div style="background: #ffebee; padding: 15px; border-radius: 50%; color: #c62828; font-size: 24px;">
                <i class="fa-solid fa-arrow-up-short-wide"></i>
            </div>
            <div>
                <p style="margin: 0; color: #666; font-size: 14px; font-weight: 600;">Total Reservas (Unidades)</p>
                <h2 style="margin: 5px 0 0 0; color: #1a1a1a; font-size: 28px;">{{ totalEgresos }}</h2>
            </div>
        </div>

        <div style="background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); border-left: 5px solid #273481; display: flex; align-items: center; gap: 20px;">
            <div style="background: #e3e6f3; padding: 15px; border-radius: 50%; color: #273481; font-size: 24px;">
                <i class="fa-solid fa-boxes-stacked"></i>
            </div>
            <div>
                <p style="margin: 0; color: #666; font-size: 14px; font-weight: 600;">Catálogo Activo</p>
                <h2 style="margin: 5px 0 0 0; color: #1a1a1a; font-size: 28px;">{{ totalMaterialesDistintos }} SAPs</h2>
            </div>
        </div>
    </div>

    <div style="display: grid; grid-template-columns: 1fr 2fr; gap: 20px;">

        <div style="background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05);">
            <h4 style="margin-top: 0; color: #333; text-align: center;">Flujo de Movimientos</h4>
            <div style="position: relative; height: 300px; display: flex; justify-content: center;">
                <canvas #graficoDona></canvas>
            </div>
        </div>

        <div style="background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05);">
            <h4 style="margin-top: 0; color: #333;">Top 5: Materiales con más Stock</h4>
            <div style="position: relative; height: 300px;">
                <canvas #graficoBarras></canvas>
            </div>
        </div>

    </div>
</div>
